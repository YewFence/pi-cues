[settings]
lockfile = true
env_shell_expand = true
minimum_release_age = "3d"

[tools]
# https://nodejs.org/
node = "26"
# https://aubepkg.github.io/aube/
aube = "2"
hk = "1"
"github:suzuki-shunsuke/nllint" = "1"
pinact = "4"
typos = "1.48.0"
betterleaks = "1"
actionlint = "1"

[vars]
nllint_excludes = ""

[env]
PINACT_MIN_AGE = "3"
PINACT_GITHUB_TOKEN = { value = "${MISE_GITHUB_TOKEN:-}", redact = true }

[tasks."deps:check"]
description = "Check the Node dependency lockfile"
run = "aube install --dry-run"

[tasks."deps:fix"]
description = "Regenerate the Node dependency lockfile"
run = "aube install --lockfile-only"

[tasks."deps:update"]
description = "Update Node dependencies"
run = "aube update"

[tasks."deps:install"]
description = "Install Node dependencies from the lockfile"
run = "aube install --frozen-lockfile"

[tasks.test]
description = "Run Node tests"
run = "aube exec vitest --run"

[tasks."fmt:check"]
description = "Check TypeScript formatting"
run = "aube exec oxfmt --check ."

[tasks."fmt:fix"]
description = "Format TypeScript code"
run = "aube exec oxfmt ."

[tasks.lint]
description = "Lint and type-check TypeScript code"
run = ["aube exec oxlint", "aube exec tsc --noEmit"]

[tasks."lint:fix"]
description = "Fix auto-correctable TypeScript lint issues"
run = "aube exec oxlint --fix"

[tasks.build]
description = "Build the package for publishing"
run = "aube exec tsdown src/piCues/index.ts"

[tasks."build:check"]
description = "Check that the TypeScript project type-checks"
run = "aube exec tsc --noEmit"

[tasks."leaks:check"]
description = "Run betterleaks checks"
run = '''
if jj root >/dev/null 2>&1; then
    jj diff --git 2>/dev/null | betterleaks stdin --redact --no-banner
else
    betterleaks git . --pre-commit --redact --no-banner
fi
'''

[tasks."typos:check"]
description = "Run Typos Lint"
run = "typos"

[tasks."typos:fix"]
description = "Fix Typos Lint"
run = "typos --write-changes"

[tasks."newline:check"]
description = "Check final newlines and surrounding whitespace in tracked text files"
shell = "bash -c"
run = '''
set -o pipefail
if jj root >/dev/null 2>&1; then
    jj --ignore-working-copy file list -T 'path ++ "\0"' | xargs -0 nllint --trim-space
else
    git grep -Ilz '' -- . {{ vars.nllint_excludes }} | xargs -0 nllint --trim-space
fi
'''

[tasks."newline:fix"]
description = "Fix final newlines and surrounding whitespace in tracked text files"
shell = "bash -c"
run = '''
set -o pipefail
if jj root >/dev/null 2>&1; then
    jj --ignore-working-copy file list -T 'path ++ "\0"' | xargs -0 nllint --fix --trim-space
else
    git grep -Ilz '' -- . {{ vars.nllint_excludes }} | xargs -0 nllint --fix --trim-space
fi
'''

[tasks.check]
description = "Run read-only Node and repository checks"
run = [
  { tasks = [ "deps:check", "newline:check", "typos:check", "fmt:check", "build:check" ] },
  { task = "leaks:check" },
  { task = "actions:check" },
  { task = "lint" },
  { task = "test" }
]
alias = "c"

[tasks.fix]
description = "Fix Node dependencies and formatting"
run = [
  { task = "deps:fix" },
  { task = "newline:fix" },
  { task = "typos:fix" },
  { task = "fmt:fix" },
  { task = "lint:fix" }
]
alias = "f"

[tasks.'hooks:install']
description = "Install Git hooks managed by hk"
run = "hk install"
# node and aube are declared by the base Node toolchain; the docs site needs no extra mise tools
[tasks.'docs:install']
description = "Install documentation site dependencies"
dir = "docs"
run = "aube install"

[tasks.'docs:lock']
description = "Generate the documentation lockfile without installing dependencies"
dir = "docs"
run = "aube install --lockfile-only"

[tasks.'docs:install:locked']
description = "Install documentation dependencies from the committed lockfile"
dir = "docs"
run = "aube install --frozen-lockfile"

[tasks.'docs:dev']
description = "Start the VitePress documentation site"
depends = ["docs:install:locked"]
dir = "docs"
run = "aube exec vitepress dev"

[tasks.'docs:build']
description = "Build the VitePress documentation site"
depends = ["docs:install:locked"]
dir = "docs"
run = "aube exec vitepress build"

[tasks.'docs:preview']
description = "Preview the VitePress documentation site"
depends = ["docs:install:locked"]
dir = "docs"
run = "aube exec vitepress preview"

[tasks."actions:check"]
description = "Run actionlint"
depends = ["actions:pin-offline:check"]
run = "actionlint .github/workflows/*.yml"

[tasks.'actions:update']
description = "Update GitHub Action versions and pin to commit hashes"
run = "pinact run --update"

[tasks.'actions:pin-offline:check']
description = "Check GitHub Action versions and pin to commit hashes"
run = "unset PINACT_MIN_AGE && pinact run --fix=false --no-api"
